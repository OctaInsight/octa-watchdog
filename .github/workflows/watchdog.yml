# Octa Watchdog: a run every 6 hours (00:17, 06:17, 12:17 and 18:17 UTC; GitHub may start it a little later). The
# runner records the start in both databases, connects Proton VPN for the country chosen in the Watchdog app, opens
# every app and website, and saves the results. "Run workflow" on the Actions tab starts a run at once.
#
# GitHub secrets (Settings > Secrets and variables > Actions):
#   WATCHDOG_KEY        made in the Watchdog app (Admin > Runner key)
#   PROTON_WG_<CODE>    one Proton VPN WireGuard file per country, e.g. PROTON_WG_NL, PROTON_WG_US (the whole file)
name: Watchdog

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run now, even if the last run was recent"
        type: boolean
        default: true

permissions:
  contents: read
  actions: write           # only for the keep-alive call below (re-enables this workflow's schedule)

concurrency:
  group: watchdog
  cancel-in-progress: false

env:
  OCTA_DB_URL: https://uxqeukvmnfvpgsxktgvo.supabase.co
  OCTA_DB_KEY: sb_publishable_oFEaDte2Hy-gGsqpa9kWeQ_HuMm6dou          # publishable key: safe to show
  DF_DB_URL: https://elqdtcmewughlpwejtsn.supabase.co
  DF_DB_KEY: sb_publishable_5NLkYdjK8C4yH9nik5ftjQ_BiHKo7hy            # publishable key: safe to show
  WATCHDOG_KEY: ${{ secrets.WATCHDOG_KEY }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Is a run due?
        id: check
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: |
          pip install --quiet requests
          if [ "$FORCE" = "true" ]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
          else
            python runner/watchdog_run.py --check
          fi

      - name: Install browser and WireGuard
        if: steps.check.outputs.due == 'true'
        run: |
          pip install --quiet playwright requests
          python -m playwright install --with-deps chromium
          sudo apt-get install -y -qq wireguard-tools > /dev/null

      - name: Run
        if: steps.check.outputs.due == 'true'
        env:                     # one Proton WireGuard file per country; countries without a secret are empty
          PROTON_WG_NL: ${{ secrets.PROTON_WG_NL }}
          PROTON_WG_US: ${{ secrets.PROTON_WG_US }}
          PROTON_WG_JP: ${{ secrets.PROTON_WG_JP }}
          PROTON_WG_PL: ${{ secrets.PROTON_WG_PL }}
          PROTON_WG_RO: ${{ secrets.PROTON_WG_RO }}
          PROTON_WG_NO: ${{ secrets.PROTON_WG_NO }}
          PROTON_WG_CH: ${{ secrets.PROTON_WG_CH }}
          PROTON_WG_SG: ${{ secrets.PROTON_WG_SG }}
          PROTON_WG_MX: ${{ secrets.PROTON_WG_MX }}
          PROTON_WG_CA: ${{ secrets.PROTON_WG_CA }}
          PROTON_WG_DE: ${{ secrets.PROTON_WG_DE }}
          PROTON_WG_FR: ${{ secrets.PROTON_WG_FR }}
          PROTON_WG_GB: ${{ secrets.PROTON_WG_GB }}
          PROTON_WG_ES: ${{ secrets.PROTON_WG_ES }}
          PROTON_WG_IT: ${{ secrets.PROTON_WG_IT }}
          PROTON_WG_SE: ${{ secrets.PROTON_WG_SE }}
          PROTON_WG_FI: ${{ secrets.PROTON_WG_FI }}
          PROTON_WG_DK: ${{ secrets.PROTON_WG_DK }}
          PROTON_WG_AT: ${{ secrets.PROTON_WG_AT }}
          PROTON_WG_BE: ${{ secrets.PROTON_WG_BE }}
          PROTON_WG_PT: ${{ secrets.PROTON_WG_PT }}
          PROTON_WG_GR: ${{ secrets.PROTON_WG_GR }}
          PROTON_WG_IE: ${{ secrets.PROTON_WG_IE }}
          PROTON_WG_AU: ${{ secrets.PROTON_WG_AU }}
          PROTON_WG_IN: ${{ secrets.PROTON_WG_IN }}
          PROTON_WG_BR: ${{ secrets.PROTON_WG_BR }}
          PROTON_WG_ZA: ${{ secrets.PROTON_WG_ZA }}
          PROTON_WG_EG: ${{ secrets.PROTON_WG_EG }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then python runner/watchdog_run.py --force; else python runner/watchdog_run.py; fi

      # GitHub switches off schedules in repositories with no activity for 60 days. Enabling the workflow again
      # through GitHub's own API resets that clock; it changes nothing in the code.
      - name: Keep the schedule alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh api -X PUT "repos/$REPO/actions/workflows/watchdog.yml/enable" || true
